<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/css/style.css" />
    <title>Document</title>
  </head>
  <body>
    <!-- import main header using js -->
    <div id="header-placeholder"></div>
    <main>
      <!-- import sidebar using js -->
      <div id="sidebar-placeholder"></div>
      <div class="artist-page">
        <div class="artist-banner">
          <div class="artist-banner-info">
            <h2>Daft Punk</h2>
            <span>20,795,080 monthly listeners</span>
          </div>
          <div class="artist-banner-actions">
            <img src="./assets/artists_img/icons big (25).png" alt="Play" />
            <button>Follow</button>
            <img src="./assets/artists_img/icons big (26).png" alt="Share" />
            <img src="./assets/artists_img/pc-playlist-down.png" alt="follow" />
            <img src="./assets/artists_img/icons big (27).png" alt="More" />
          </div>
        </div>
        <div class="artist-body"></div>
      </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="./app.js"></script>
  </body>
</html>
